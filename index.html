<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>台湾夜市 - 射的ゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Maru Gothic ProN', 'PingFang TC', sans-serif;
      background: #0f051d;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 台湾夜市風ヘッダー */
    .header {
      width: 100%;
      max-width: 480px;
      padding: 8px 15px;
      background: linear-gradient(90deg, #b91c1c, #831843);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #f59e0b;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      z-index: 10;
    }
    .title {
      font-size: 16px;
      font-weight: bold;
      color: #fef08a;
      text-shadow: 0 0 8px #f59e0b;
      margin: 0;
    }
    .status-bar {
      display: flex;
      gap: 10px;
      font-size: 13px;
      font-weight: bold;
    }
    .coin-val { color: #facc15; }
    .pt-val { color: #38bdf8; }

    /* メインゲームコンテナ */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: calc(100vh - 50px);
      background: #18092b;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 夜市アーケードHUB（ゲーム選択） */
    #hub-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #2e1065 0%, #0f051d 100%);
      z-index: 30;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hub-title {
      font-size: 26px;
      color: #f43f5e;
      text-shadow: 0 0 10px #f43f5e;
      margin-bottom: 5px;
    }
    .hub-subtitle { font-size: 12px; color: #cbd5e1; margin-bottom: 20px; }
    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #f59e0b;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }
    .game-card.locked {
      border-color: #475569;
      opacity: 0.6;
    }
    .game-icon { font-size: 40px; }
    .game-name { font-weight: bold; margin-top: 5px; font-size: 14px; color: #fef08a; }
    .game-cost { font-size: 11px; color: #cbd5e1; }

    /* 射的ゲームキャンバスエリア */
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 銃の直感操作UIバー */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      pointer-events: none;
    }
    .control-group { pointer-events: auto; }

    /* 左側：銃身エレベート（上下照準スライダー） */
    .aim-slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fde047;
      font-size: 11px;
      font-weight: bold;
    }
    .aim-slider {
      -webkit-appearance: slider-vertical;
      width: 30px;
      height: 90px;
      accent-color: #ef4444;
    }

    /* 右側：トリガー＆コッキングボタン */
    .trigger-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
      border: 4px solid #fef08a;
      color: white;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .trigger-btn:active {
      transform: scale(0.95);
      background: radial-gradient(circle, #dc2626 0%, #7f1d1d 100%);
    }

    /* 戻るボタン */
    .btn-back {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 5px 12px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #f59e0b;
      color: white;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      z-index: 20;
    }

    /* ポップアップメッセージ */
    .hit-popup {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: bold;
      color: #fef08a;
      text-shadow: 0 0 10px #f59e0b, 0 0 20px #ef4444;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s ease-out;
      z-index: 25;
    }
    .hit-popup.show {
      opacity: 1;
      transform: translate(-50%, -80%) scale(1.2);
    }
  </style>
</head>
<body>

  <!-- ヘッダーUI -->
  <div class="header">
    <h1 class="title">🏮 台灣夜市 遊戲樂園</h1>
    <div class="status-bar">
      <div>🪙 コイン: <span id="coin-txt" class="coin-val">100</span></div>
      <div>⭐ PT: <span id="pt-txt" class="pt-val">0</span></div>
    </div>
  </div>

  <div class="game-container">

    <!-- HUB画面（ゲーム選択・解放画面） -->
    <div id="hub-screen">
      <div class="hub-title">夜市遊樂場</div>
      <div class="hub-subtitle">お小遣い（コイン）で遊んでポイントを貯めよう！</div>

      <div class="game-grid">
        <div class="game-card" onclick="startShootingGame()">
          <div class="game-icon">🎯</div>
          <div class="game-name">夜市 射擊大戰</div>
          <div class="game-cost">1プレイ: 10 コイン</div>
        </div>
        <div class="game-card locked">
          <div class="game-icon">🐟</div>
          <div class="game-name">金魚すくい</div>
          <div class="game-cost">1000 PTで解放</div>
        </div>
        <div class="game-card locked">
          <div class="game-icon">🔮</div>
          <div class="game-name">スマートボール</div>
          <div class="game-cost">2500 PTで解放</div>
        </div>
        <div class="game-card locked">
          <div class="game-icon">⭕</div>
          <div class="game-name">夜市 輪投げ</div>
          <div class="game-cost">5000 PTで解放</div>
        </div>
      </div>
    </div>

    <!-- 射的ゲームプレイ画面 -->
    <button class="btn-back" onclick="showHub()">🏠 屋台一覧</button>
    <div id="hit-msg" class="hit-popup">獲得！</div>
    <canvas id="gameCanvas"></canvas>

    <!-- 直感操作UI -->
    <div class="controls-overlay" id="controls" style="display:none;">
      <div class="control-group aim-slider-container">
        <span>じゅうこう</span>
        <input type="range" min="0" max="100" value="50" class="aim-slider" id="aimSlider" orient="vertical">
      </div>

      <div class="control-group">
        <div class="trigger-btn" id="triggerBtn">
          <span>撃つ！</span>
          <span style="font-size:10px; font-weight:normal; opacity:0.8;">長押しでパワー</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- グローバル状態（お小遣い＆ポイント） ---
    let coins = 100;
    let points = 0;

    const coinEl = document.getElementById('coin-txt');
    const ptEl = document.getElementById('pt-txt');
    const hubScreen = document.getElementById('hub-screen');
    const controls = document.getElementById('controls');
    const hitMsg = document.getElementById('hit-msg');

    function updateUI() {
      coinEl.innerText = coins;
      ptEl.innerText = points;
    }

    function showHub() {
      hubScreen.style.display = 'flex';
      controls.style.display = 'none';
      isPlaying = false;
    }

    // --- Web Audio API（効果音・BGM generation） ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'shoot') { // 射擊音（ポン！）
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
      } else if (type === 'hit') { // 命中标的音
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'rare') { // レアゲットファンファーレ
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // --- 射的ゲーム本体 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const aimSlider = document.getElementById('aimSlider');
    const triggerBtn = document.getElementById('triggerBtn');

    let W, H;
    let isPlaying = false;
    let bullets = [];
    let power = 0;
    let powerTimer = null;

    // 6段階の景品設定
    const PRIZE_TYPES = [
      { rank: 1, name: "芒果冰 (かき氷)", color: "#facc15", size: 45, hp: 1, pt: 100, speed: 0, icon: "🍧" },
      { rank: 2, name: "小籠包", color: "#fde047", size: 38, hp: 1, pt: 200, speed: 0.8, icon: "🥟" },
      { rank: 3, name: "珍珠奶茶 (タピオカ)", color: "#fb923c", size: 35, hp: 2, pt: 400, speed: 1.2, icon: "🧋" },
      { rank: 4, name: "台灣燈籠 (提灯)", color: "#ef4444", size: 30, hp: 2, pt: 700, speed: 2.0, icon: "🏮" },
      { rank: 5, name: "熊公仔 (大ベア)", color: "#a855f7", size: 50, hp: 4, pt: 1200, speed: 1.5, icon: "🧸" },
      { rank: 6, name: "黃金神龍 (金龍像)", color: "#eab308", size: 25, hp: 3, pt: 2000, speed: 3.5, icon: "🐉" }
    ];

    let prizes = [];

    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = canvas.width = rect.width;
      H = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);

    function startShootingGame() {
      if (coins < 10) {
        alert("コインが足りません！");
        return;
      }
      coins -= 10;
      updateUI();

      hubScreen.style.display = 'none';
      controls.style.display = 'flex';
      isPlaying = true;
      resize();
      initPrizes();
      gameLoop();
    }

    // 棚に景品を配置
    function initPrizes() {
      prizes = [];
      const shelves = [H * 0.22, H * 0.42, H * 0.62]; // 3段の棚

      shelves.forEach((shelfY, shelfIndex) => {
        const count = 3;
        for (let i = 0; i < count; i++) {
          const rankIndex = Math.min(shelfIndex * 2 + (i % 2), PRIZE_TYPES.length - 1);
          const type = PRIZE_TYPES[rankIndex];
          prizes.push({
            ...type,
            x: (W / (count + 1)) * (i + 1),
            y: shelfY - type.size / 2,
            maxHp: type.hp,
            currentHp: type.hp,
            dir: i % 2 === 0 ? 1 : -1,
            shelfY: shelfY
          });
        }
      });
    }

    // 操作処理（コッキング＆トリガー）
    let isPressing = false;
    triggerBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startPower();
    });
    triggerBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      shoot();
    });
    triggerBtn.addEventListener('mousedown', startPower);
    triggerBtn.addEventListener('mouseup', shoot);

    function startPower() {
      if (!isPlaying) return;
      isPressing = true;
      power = 10;
      powerTimer = setInterval(() => {
        if (power < 100) power += 5;
      }, 30);
    }

    function shoot() {
      if (!isPressing || !isPlaying) return;
      clearInterval(powerTimer);
      isPressing = false;

      const sliderVal = parseInt(aimSlider.value);
      // スライダー（0~100）から発射角度を計算
      const angle = -Math.PI * 0.15 - (sliderVal / 100) * (Math.PI * 0.35);
      const speed = 12 + (power / 100) * 15;

      bullets.push({
        x: W / 2,
        y: H - 80,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 6
      });

      playSound('shoot');
      power = 0;
    }

    // 描画：台湾夜市風の背景と棚
    function drawBackground() {
      // 提灯とネオン背景
      ctx.fillStyle = "#18092b";
      ctx.fillRect(0, 0, W, H);

      // 木製レトロ棚（3段）
      const shelves = [H * 0.22, H * 0.42, H * 0.62];
      ctx.fillStyle = "#78350f";
      ctx.shadowColor = "#000";
      ctx.shadowBlur = 10;
      shelves.forEach(y => {
        ctx.fillRect(10, y, W - 20, 12);
        ctx.fillStyle = "#451a03";
        ctx.fillRect(10, y + 12, W - 20, 6);
        ctx.fillStyle = "#78350f";
      });
      ctx.shadowBlur = 0;

      // 台湾夜市看板
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(W / 2 - 60, 10, 120, 30);
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 2;
      ctx.strokeRect(W / 2 - 58, 12, 116, 26);
      ctx.fillStyle = "#fde047";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🏮 繁華夜市 🏮", W / 2, 30);
    }

    // 描画：レーザー照準ガイド
    function drawAimGuide() {
      const sliderVal = parseInt(aimSlider.value);
      const angle = -Math.PI * 0.15 - (sliderVal / 100) * (Math.PI * 0.35);

      ctx.strokeStyle = "rgba(239, 68, 68, 0.5)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(W / 2, H - 80);
      ctx.lineTo(W / 2 + Math.cos(angle) * 300, (H - 80) + Math.sin(angle) * 300);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 描画：ライフル（プレイヤー銃身）
    function drawRifle() {
      ctx.save();
      ctx.translate(W / 2, H - 60);

      const sliderVal = parseInt(aimSlider.value);
      const angle = -Math.PI * 0.15 - (sliderVal / 100) * (Math.PI * 0.35);
      ctx.rotate(angle + Math.PI / 2);

      // 木製ストック
      ctx.fillStyle = "#92400e";
      ctx.fillRect(-8, 10, 16, 50);

      // 金属銃身
      ctx.fillStyle = "#475569";
      ctx.fillRect(-4, -50, 8, 60);

      // パワーゲージ表示（チャージ時）
      if (power > 0) {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(-6, 0, 12, -(power / 100) * 40);
      }

      ctx.restore();
    }

    function showPopup(text) {
      hitMsg.innerText = text;
      hitMsg.classList.add('show');
      setTimeout(() => hitMsg.classList.remove('show'), 1000);
    }

    // メインゲームループ
    function gameLoop() {
      if (!isPlaying) return;

      drawBackground();
      drawAimGuide();

      // 景品の移動と描画
      prizes.forEach((p, idx) => {
        if (p.speed > 0) {
          p.x += p.speed * p.dir;
          if (p.x - p.size / 2 < 20 || p.x + p.size / 2 > W - 20) {
            p.dir *= -1;
          }
        }

        // 景品本体（アイコン＋HP）
        ctx.font = `${p.size}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.icon, p.x, p.y);

        // HPゲージ（多重ヒットが必要な場合）
        if (p.maxHp > 1) {
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(p.x - 15, p.y - p.size / 2 - 8, 30, 4);
          ctx.fillStyle = "#22c55e";
          ctx.fillRect(p.x - 15, p.y - p.size / 2 - 8, (30 * (p.currentHp / p.maxHp)), 4);
        }
      });

      // 弾の移動と判定
      bullets.forEach((b, bIdx) => {
        b.x += b.vx;
        b.y += b.vy;

        // 弾の描画（BB弾）
        ctx.fillStyle = "#fde047";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        // 当たり判定
        prizes.forEach((p, pIdx) => {
          const dist = Math.hypot(b.x - p.x, b.y - p.y);
          if (dist < p.size / 2 + b.radius) {
            p.currentHp -= 1;
            bullets.splice(bIdx, 1);

            if (p.currentHp <= 0) {
              // 景品ゲット！
              playSound(p.rank >= 5 ? 'rare' : 'hit');
              points += p.pt;
              coins += Math.floor(p.pt / 10); // コイン還元
              updateUI();
              showPopup(`🎯 ${p.name} GET! +${p.pt}PT`);

              // 景品リスポーン
              setTimeout(() => {
                p.currentHp = p.maxHp;
                p.x = W * 0.2 + Math.random() * (W * 0.6);
              }, 1500);
            } else {
              playSound('hit');
            }
          }
        });
      });

      // 画面外の弾削除
      bullets = bullets.filter(b => b.x > 0 && b.x < W && b.y > 0 && b.y < H);

      drawRifle();

      requestAnimationFrame(gameLoop);
    }

    // 初期化
    window.onload = () => {
      resize();
      updateUI();
    };
  </script>
</body>
</html>
